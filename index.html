<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mapa de Estudios</title></head><body style="margin:0"><title>Mapa de Estudios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
  :root{
    --paper:#EDF0E6;
    --surface:#FFFFFF;
    --surface-2:#F6F7F1;
    --ink:#1C2317;
    --muted:#5C6455;
    --line:#D7DBCB;
    --line-strong:#C3C9B6;
    --accent:#B0391E;
    --accent-ink:#FFF8F3;
    --accent-2:#2E5B57;
    --accent-2-ink:#F2FAF8;
    --shadow: 0 12px 28px -14px rgba(28,35,23,0.35), 0 2px 6px -2px rgba(28,35,23,0.18);
    --radius-s: 8px;
    --radius-m: 14px;
    --radius-l: 20px;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#12160E;
      --surface:#181D13;
      --surface-2:#1E2417;
      --ink:#E9ECDF;
      --muted:#9AA38C;
      --line:#2B331F;
      --line-strong:#38412A;
      --accent:#E2713F;
      --accent-ink:#1B1200;
      --accent-2:#63A39B;
      --accent-2-ink:#08201D;
      --shadow: 0 12px 28px -14px rgba(0,0,0,0.6), 0 2px 6px -2px rgba(0,0,0,0.4);
    }
  }
  :root[data-theme="dark"]{
    --paper:#12160E;
    --surface:#181D13;
    --surface-2:#1E2417;
    --ink:#E9ECDF;
    --muted:#9AA38C;
    --line:#2B331F;
    --line-strong:#38412A;
    --accent:#E2713F;
    --accent-ink:#1B1200;
    --accent-2:#63A39B;
    --accent-2-ink:#08201D;
    --shadow: 0 12px 28px -14px rgba(0,0,0,0.6), 0 2px 6px -2px rgba(0,0,0,0.4);
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    height:100%;
    overflow:hidden;
  }
  html{height:100%;}
  .mono{font-family:"IBM Plex Mono", ui-monospace, monospace;}
  button{font-family:inherit;}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

  .app{
    height:100%;
    display:flex;
    flex-direction:column;
    padding-top:env(safe-area-inset-top,0px);
  }

  /* ---------- Topbar ---------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:14px 18px;
    background:var(--surface);
    border-bottom:1px solid var(--line);
    flex:0 0 auto;
  }
  .brand h1{
    margin:0;
    font-size:1.05rem;
    font-weight:700;
    letter-spacing:-0.01em;
  }
  .brand p{
    margin:2px 0 0;
    font-size:0.78rem;
    color:var(--muted);
  }
  .topbar-actions{display:flex; align-items:center; gap:8px;}

  .btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    border:1px solid var(--line-strong);
    background:var(--surface);
    color:var(--ink);
    padding:8px 12px;
    border-radius:var(--radius-s);
    font-size:0.82rem;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
  }
  .btn:hover{border-color:var(--accent);}
  .btn-accent{
    background:var(--accent);
    border-color:var(--accent);
    color:var(--accent-ink);
  }
  .btn-accent:hover{filter:brightness(1.06);}
  .btn-icon{
    padding:8px;
    width:36px; height:36px;
    justify-content:center;
  }
  .btn-ghost{
    background:transparent;
    border-color:transparent;
  }
  .btn-ghost:hover{background:var(--surface-2); border-color:var(--line);}

  /* ---------- Subbar (layer switch) ---------- */
  .subbar{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    gap:14px;
    padding:10px 18px;
    background:var(--surface-2);
    border-bottom:1px solid var(--line);
    flex-wrap:wrap;
  }
  .seg{
    display:inline-flex;
    background:var(--surface);
    border:1px solid var(--line-strong);
    border-radius:999px;
    padding:3px;
    gap:2px;
  }
  .seg button{
    border:none;
    background:transparent;
    color:var(--muted);
    padding:7px 14px;
    border-radius:999px;
    font-size:0.8rem;
    font-weight:600;
    cursor:pointer;
  }
  .seg button.active{
    background:var(--accent-2);
    color:var(--accent-2-ink);
  }
  /* ---------- Body layout ---------- */
  .body{
    flex:1 1 auto;
    display:flex;
    min-height:0;
  }

  .rail{
    flex:0 0 300px;
    width:300px;
    background:var(--surface);
    border-right:1px solid var(--line);
    display:flex;
    flex-direction:column;
    min-height:0;
  }
  .rail-head{
    padding:14px 14px 10px;
    border-bottom:1px solid var(--line);
    flex:0 0 auto;
  }
  .search{
    display:flex;
    align-items:center;
    gap:8px;
    border:1px solid var(--line-strong);
    border-radius:var(--radius-s);
    padding:8px 10px;
    background:var(--surface-2);
  }
  .search input{
    border:none;
    background:transparent;
    outline:none;
    font-size:0.85rem;
    color:var(--ink);
    width:100%;
    font-family:inherit;
  }
  .search svg{flex:0 0 auto; color:var(--muted);}
  .rail-quick{
    display:flex;
    gap:8px;
    margin-top:10px;
  }
  .rail-quick button{
    flex:1;
    border:1px solid var(--line-strong);
    background:var(--surface);
    color:var(--ink);
    font-size:0.74rem;
    font-weight:600;
    padding:6px 8px;
    border-radius:var(--radius-s);
    cursor:pointer;
  }
  .rail-quick button:hover{border-color:var(--accent);}
  .layerToggles{
    display:flex;
    flex-direction:column;
    gap:6px;
    margin-top:12px;
    padding-top:12px;
    border-top:1px solid var(--line);
  }
  .layerToggles-label{
    font-size:0.68rem;
    font-weight:700;
    letter-spacing:0.03em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:2px;
  }
  .layerToggle{
    display:flex;
    align-items:center;
    gap:8px;
    padding:6px 8px;
    border-radius:var(--radius-s);
    cursor:pointer;
    font-size:0.8rem;
    font-weight:600;
    user-select:none;
  }
  .layerToggle:hover{background:var(--surface-2);}
  .layerToggle input{flex:0 0 auto; width:16px; height:16px; accent-color:var(--accent-2);}
  .layerToggle .swatch{
    flex:0 0 auto;
    width:13px; height:13px;
    border-radius:50%;
    border:1.5px solid rgba(0,0,0,0.25);
  }
  .layerToggle .lt-name{flex:1 1 auto;}
  .layerToggle .lt-count{font-size:0.72rem; color:var(--muted); font-weight:500;}
  .rail-list{
    flex:1 1 auto;
    overflow-y:auto;
    padding:6px;
  }
  .row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px;
    border-radius:var(--radius-s);
    cursor:pointer;
  }
  .row:hover{background:var(--surface-2);}
  .row.dimmed .badge, .row.dimmed .rowname{opacity:0.4;}
  .badge{
    flex:0 0 auto;
    width:30px; height:30px;
    border-radius:50%;
    background:var(--accent);
    color:var(--accent-ink);
    display:flex; align-items:center; justify-content:center;
    font-size:0.78rem;
    font-weight:700;
  }
  .rowtext{flex:1 1 auto; min-width:0;}
  .rowname{
    font-size:0.85rem;
    font-weight:600;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .rowname.placeholder{font-style:italic; font-weight:500; color:var(--muted);}
  .rowsub{font-size:0.72rem; color:var(--muted);}
  .chk{
    flex:0 0 auto;
    width:18px; height:18px;
    accent-color:var(--accent);
    cursor:pointer;
  }
  .rail-empty{
    padding:24px 14px;
    text-align:center;
    color:var(--muted);
    font-size:0.82rem;
  }

  /* ---------- Stage ---------- */
  .stage-wrap{
    position:relative;
    flex:1 1 auto;
    min-width:0;
    background:
      linear-gradient(var(--paper),var(--paper));
    overflow:hidden;
  }
  .stage{
    position:absolute;
    inset:0;
    overflow:hidden;
    touch-action:none;
    cursor:grab;
  }
  .stage.panning{cursor:grabbing;}
  .stage.selecting{cursor:crosshair;}
  .world{
    position:absolute;
    top:0; left:0;
    width:2006px;
    height:2432px;
    transform-origin:0 0;
    will-change:transform;
  }
  .world img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    user-select:none;
    -webkit-user-drag:none;
    pointer-events:none;
    display:block;
  }
  .world img[hidden]{display:none;}
  .planLayer{
    position:absolute;
    top:0; left:0;
    width:2006px;
    height:2432px;
    transform-origin:0 0;
  }
  .planLayer[hidden]{display:none;}
  .planLayer img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    user-select:none;
    -webkit-user-drag:none;
    pointer-events:none;
    display:block;
  }
  .pins{position:absolute; inset:0;}
  .pin{
    position:absolute;
    transform:translate(-50%,-50%);
    width:34px; height:34px;
    border-radius:50%;
    background:var(--accent);
    color:var(--accent-ink);
    border:2.5px solid var(--accent-ink);
    box-shadow:0 2px 6px rgba(0,0,0,0.35);
    display:flex; align-items:center; justify-content:center;
    font-size:0.78rem;
    font-weight:700;
    cursor:pointer;
    padding:0;
    font-family:"IBM Plex Mono", monospace;
  }
  .pin:hover{filter:brightness(1.08);}
  .pin.active{
    background:var(--accent-2);
    border-color:var(--accent-2-ink);
    color:var(--accent-2-ink);
    width:40px; height:40px;
    font-size:0.85rem;
    z-index:5;
  }
  .pin.dimmed{display:none;}

  .dotpin{
    position:absolute;
    transform:translate(-50%,-50%);
    width:18px; height:18px;
    border-radius:50%;
    border:2px solid #fff;
    box-shadow:0 1px 4px rgba(0,0,0,0.45);
    pointer-events:none;
  }

  .selRect{
    position:absolute;
    border:2px dashed var(--accent-2);
    background:color-mix(in srgb, var(--accent-2) 15%, transparent);
    pointer-events:none;
  }

  /* floating zoom controls */
  .zoomctl{
    position:absolute;
    right:14px;
    bottom:14px;
    display:flex;
    flex-direction:column;
    gap:6px;
    z-index:6;
  }
  .zoomctl button{
    width:38px; height:38px;
    border-radius:var(--radius-s);
    border:1px solid var(--line-strong);
    background:var(--surface);
    color:var(--ink);
    font-size:1.05rem;
    font-weight:700;
    cursor:pointer;
    box-shadow:var(--shadow);
  }
  .zoomctl button:hover{border-color:var(--accent);}

  /* rail toggle (mobile) */
  .railToggle{
    position:absolute;
    left:14px;
    bottom:14px;
    z-index:6;
    box-shadow:var(--shadow);
    display:none;
  }

  /* selection banner */
  .selBanner{
    position:absolute;
    top:14px;
    left:50%;
    transform:translateX(-50%);
    z-index:7;
    background:var(--surface);
    border:1px solid var(--line-strong);
    box-shadow:var(--shadow);
    border-radius:999px;
    padding:8px 8px 8px 16px;
    display:flex;
    align-items:center;
    gap:10px;
    font-size:0.8rem;
    max-width:92vw;
  }
  .selBanner[hidden]{display:none;}
  .selBanner .actions{display:flex; gap:6px;}

  /* detail card */
  .detailCard{
    position:absolute;
    left:14px;
    bottom:14px;
    z-index:7;
    width:300px;
    max-width:calc(100vw - 28px);
    background:var(--surface);
    border:1px solid var(--line);
    box-shadow:var(--shadow);
    border-radius:var(--radius-m);
    padding:14px;
  }
  .detailCard[hidden]{display:none;}
  .detailCard-head{
    display:flex;
    align-items:flex-start;
    gap:10px;
  }
  .detailCard .badge{width:36px; height:36px; font-size:0.9rem;}
  .detailCard-title{flex:1 1 auto; min-width:0;}
  .detailCard-title h3{
    margin:0;
    font-size:0.98rem;
    font-weight:700;
    line-height:1.25;
  }
  .detailCard-title h3.placeholder{font-style:italic; color:var(--muted); font-weight:600;}
  .detailCard-title p{
    margin:2px 0 0;
    font-size:0.76rem;
    color:var(--muted);
  }
  .detailCard-close{
    flex:0 0 auto;
    width:26px; height:26px;
    border-radius:50%;
    border:none;
    background:var(--surface-2);
    color:var(--muted);
    cursor:pointer;
    font-size:0.9rem;
    line-height:1;
  }
  .detailCard-close:hover{background:var(--line);}
  .detailCard-foot{
    margin-top:10px;
    display:flex;
    gap:8px;
  }
  .detailCard-foot button{flex:1;}

  /* download menu */
  .dlmenu-wrap{position:relative;}
  .dlmenu{
    position:absolute;
    top:calc(100% + 8px);
    right:0;
    background:var(--surface);
    border:1px solid var(--line);
    box-shadow:var(--shadow);
    border-radius:var(--radius-m);
    padding:6px;
    width:230px;
    z-index:20;
  }
  .dlmenu[hidden]{display:none;}
  .dlmenu button{
    width:100%;
    text-align:left;
    background:transparent;
    border:none;
    padding:10px 10px;
    border-radius:var(--radius-s);
    font-size:0.84rem;
    font-weight:600;
    color:var(--ink);
    cursor:pointer;
    display:flex;
    flex-direction:column;
    gap:1px;
  }
  .dlmenu button:hover{background:var(--surface-2);}
  .dlmenu button span{font-size:0.72rem; font-weight:400; color:var(--muted);}

  .toast{
    position:fixed;
    left:50%;
    bottom:24px;
    transform:translateX(-50%);
    background:var(--ink);
    color:var(--paper);
    padding:10px 16px;
    border-radius:999px;
    font-size:0.8rem;
    font-weight:600;
    box-shadow:var(--shadow);
    z-index:50;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}

  .scrim{
    position:fixed;
    inset:0;
    background:rgba(10,12,8,0.4);
    z-index:8;
    display:none;
  }
  .scrim.show{display:block;}

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important; animation:none !important;}
  }

  /* ---------- Mobile ---------- */
  @media (max-width: 880px){
    .rail{
      position:fixed;
      left:0; right:0; bottom:0;
      width:auto;
      flex:none;
      height:min(72vh, 560px);
      border-right:none;
      border-top:1px solid var(--line);
      border-radius:var(--radius-l) var(--radius-l) 0 0;
      transform:translateY(105%);
      transition:transform .28s ease;
      z-index:9;
      padding-bottom:env(safe-area-inset-bottom,0px);
      box-shadow:0 -10px 30px rgba(0,0,0,0.25);
    }
    .rail.open{transform:translateY(0);}
    .railToggle{display:inline-flex;}
    .brand p{display:none;}
    .brand h1{font-size:0.95rem;}
    .topbar{padding:10px 12px;}
    .subbar{padding:8px 12px;}
    .detailCard{
      left:12px; right:12px; bottom:70px;
      width:auto; max-width:none;
    }
    .zoomctl{bottom:70px;}
  }
</style>

<div class="app" id="app">
  <header class="topbar">
    <div class="brand">
      <h1>Mapa de Estudios</h1>
      <p>Predio del evento · 23 estudios de arquitectura</p>
    </div>
    <div class="topbar-actions">
      <div class="dlmenu-wrap">
        <button class="btn btn-accent" id="dlToggle" aria-haspopup="true" aria-expanded="false">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M6 11l6 6 6-6"/><path d="M5 21h14"/></svg>
          <span class="dl-label">Descargar</span>
        </button>
        <div class="dlmenu" id="dlMenu" hidden>
          <button id="dlFull" type="button">
            Mapa completo (PNG)
            <span id="dlFullSub">Foto aérea · 22 puntos</span>
          </button>
          <button id="dlCrop" type="button">
            Seleccionar área…
            <span>Elegí una porción del mapa para descargar</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <div class="subbar">
    <div class="seg" role="tablist" aria-label="Capa del mapa">
      <button type="button" id="tabAerial" class="active" role="tab" aria-selected="true">Foto aérea</button>
      <button type="button" id="tabPlan" role="tab" aria-selected="false">Plano de cotas</button>
    </div>
  </div>

  <div class="body">
    <aside class="rail" id="rail">
      <div class="rail-head">
        <div class="search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
          <input type="text" id="search" placeholder="Buscar por número o nombre" aria-label="Buscar estudio">
        </div>
        <div class="rail-quick">
          <button type="button" id="showAll">Mostrar todos</button>
          <button type="button" id="hideAll">Ocultar todos</button>
        </div>
        <div class="layerToggles">
          <div class="layerToggles-label">Otras capas</div>
          <label class="layerToggle">
            <input type="checkbox" id="toggleSenaletica" checked>
            <span class="swatch" style="background:#F2622E"></span>
            <span class="lt-name">Señalética evento</span>
            <span class="lt-count" id="countSenaletica"></span>
          </label>
          <label class="layerToggle">
            <input type="checkbox" id="toggleCarteleria" checked>
            <span class="swatch" style="background:#D51EDE"></span>
            <span class="lt-name">Cartelería comercial</span>
            <span class="lt-count" id="countCarteleria"></span>
          </label>
          <label class="layerToggle">
            <input type="checkbox" id="toggleGaleria" checked>
            <span class="swatch" style="background:#E8C21A"></span>
            <span class="lt-name">Galería de arte</span>
            <span class="lt-count" id="countGaleria"></span>
          </label>
        </div>
      </div>
      <div class="rail-list" id="railList"></div>
    </aside>

    <main class="stage-wrap">
      <div class="stage" id="stage">
        <div class="world" id="world">
          <img id="aerialImg" src="aerial.jpg" alt="Foto aérea del predio del evento">
          <div class="planLayer" id="planLayer" hidden>
            <img id="planImg" src="plan.jpg" alt="Plano de cotas y curvas de nivel del predio">
          </div>
          <div class="pins" id="extraPins"></div>
          <div class="pins" id="pins"></div>
        </div>
        <div class="selRect" id="selRect" hidden></div>
      </div>

      <div class="zoomctl">
        <button type="button" id="zoomIn" aria-label="Acercar">+</button>
        <button type="button" id="zoomOut" aria-label="Alejar">–</button>
        <button type="button" id="zoomReset" aria-label="Centrar mapa">⤢</button>
      </div>

      <button type="button" class="btn btn-accent railToggle" id="railToggle">Estudios (23)</button>

      <div class="selBanner" id="selBanner" hidden>
        <span id="selBannerText">Arrastrá sobre el mapa para elegir el área</span>
        <div class="actions">
          <button type="button" class="btn btn-ghost" id="selCancel">Cancelar</button>
          <button type="button" class="btn btn-accent" id="selConfirm" hidden>Descargar recorte</button>
        </div>
      </div>

      <div class="detailCard" id="detailCard" hidden>
        <div class="detailCard-head">
          <div class="badge" id="detailBadge"></div>
          <div class="detailCard-title">
            <h3 id="detailName"></h3>
            <p id="detailSub">Estudio de arquitectura</p>
          </div>
          <button type="button" class="detailCard-close" id="detailClose" aria-label="Cerrar">✕</button>
        </div>
        <div class="detailCard-foot">
          <button type="button" class="btn" id="detailCenter">Centrar en el mapa</button>
        </div>
      </div>
    </main>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  function applyTransform(){

  function computeFit(){
    var r = stage.getBoundingClientRect();

    state.minScale = fs;

    return r;
  }

  function resetView(animate){
    var r = computeFit();
    state.scale = state.fitScale;
    state.originX = (r.width - NATURAL_W * state.scale) / 2;
    state.originY = (r.height - NATURAL_H * state.scale) / 2;
    state.userMoved = false;
    if(animate){
      world.style.transition = "transform .35s ease";

  function clampOrigin(){
    // keep at least a sliver of the map reachable; simple soft clamp
    var r = stage.getBoundingClientRect();
    var w = NATURAL_W * state.scale, h = NATURAL_H * state.scale;
    var minX = Math.min(0, r.width - w) - w*0.4;
    var maxX = Math.max(0, r.width - w) + w*0.4;
    var minY = Math.min(0, r.height - h) - h*0.4;
    var maxY = Math.max(0, r.height - h) + h*0.4;
    state.originX = Math.max(minX, Math.min(maxX, state.originX));
    state.originY = Math.max(minY, Math.min(maxY, state.originY));
  }

    var nx = (cx - state.originX) / state.scale;
    var ny = (cy - state.originY) / state.scale;
    state.scale = newScale;
    state.originX = cx - nx * state.scale;
    state.originY = cy - ny * state.scale;
    state.userMoved = true;
    clampOrigin();
    applyTransform();
  }

  function centerOn(num){
    var m = MARKERS.find(function(x){ return x.num === num; });

    var pos = m.pos;

    var nx = (pos[0]/100) * NATURAL_W;

  // ---------- pan / zoom interactions ----------
  var pointers = {};
  var dragState = null;
  var pinchState = null;

  stage.addEventListener("pointerdown", function(e){
    if(e.target.closest(".pin")) return;
    pointers[e.pointerId] = {x:e.clientX, y:e.clientY};
    var ids = Object.keys(pointers);

    if(state.selecting){
      var r = stage.getBoundingClientRect();
      state.selStartScreen = {x: e.clientX - r.left, y: e.clientY - r.top};
      selRectEl.hidden = false;
      selRectEl.style.left = state.selStartScreen.x + "px";
      selRectEl.style.top = state.selStartScreen.y + "px";
      selRectEl.style.width = "0px";
      selRectEl.style.height = "0px";
      stage.setPointerCapture(e.pointerId);
      return;
    }

    if(ids.length === 1){
      dragState = {startX:e.clientX, startY:e.clientY, originX:state.originX, originY:state.originY};
      stage.classList.add("panning");
      stage.setPointerCapture(e.pointerId);
    } else if(ids.length === 2){
      dragState = null;
      var pts = ids.map(function(id){ return pointers[id]; });
      var dx = pts[0].x - pts[1].x, dy = pts[0].y - pts[1].y;
      pinchState = {
        dist: Math.hypot(dx, dy),
        midX: (pts[0].x + pts[1].x)/2,
        midY: (pts[0].y + pts[1].y)/2,
        scale: state.scale
      };
    }
  });

  stage.addEventListener("pointermove", function(e){
    if(!pointers[e.pointerId]) {
      if(state.selecting && state.selStartScreen){
        // fallthrough not needed
      }
      return;
    }
    pointers[e.pointerId] = {x:e.clientX, y:e.clientY};

    if(state.selecting && state.selStartScreen){
      var r = stage.getBoundingClientRect();
      var cx = e.clientX - r.left, cy = e.clientY - r.top;
      var x0 = Math.min(cx, state.selStartScreen.x), y0 = Math.min(cy, state.selStartScreen.y);
      var w = Math.abs(cx - state.selStartScreen.x), h = Math.abs(cy - state.selStartScreen.y);
      selRectEl.style.left = x0 + "px";
      selRectEl.style.top = y0 + "px";
      selRectEl.style.width = w + "px";
      selRectEl.style.height = h + "px";
      return;
    }

    var ids = Object.keys(pointers);
    if(ids.length === 2 && pinchState){
      var pts = ids.map(function(id){ return pointers[id]; });
      var dx = pts[0].x - pts[1].x, dy = pts[0].y - pts[1].y;
      var dist = Math.hypot(dx, dy);
      var factor = dist / (pinchState.dist || dist);
      var r = stage.getBoundingClientRect();
      var midX = (pts[0].x + pts[1].x)/2 - r.left;
      var midY = (pts[0].y + pts[1].y)/2 - r.top;
      zoomAt(midX, midY, factor);
      pinchState.dist = dist;
      return;
    }

    if(dragState && ids.length === 1){
      state.originX = dragState.originX + (e.clientX - dragState.startX);
      state.originY = dragState.originY + (e.clientY - dragState.startY);
      state.userMoved = true;
      applyTransform();
    }
  });

  function endPointer(e){
    delete pointers[e.pointerId];
    var ids = Object.keys(pointers);

    if(state.selecting && state.selStartScreen && ids.length === 0){
      finalizeSelection();
      return;
    }

    if(ids.length === 0){
      dragState = null;
      pinchState = null;
      stage.classList.remove("panning");
    } else if(ids.length === 1){
      pinchState = null;
      var id = ids[0];
      dragState = {startX:pointers[id].x, startY:pointers[id].y, originX:state.originX, originY:state.originY};
    }
  }

  stage.addEventListener("wheel", function(e){

    var r = stage.getBoundingClientRect();
    var cx = e.clientX - r.left, cy = e.clientY - r.top;
    var factor = Math.exp(-e.deltaY * 0.0016);
    zoomAt(cx, cy, factor);
  }, {passive:false});

  stage.addEventListener("dblclick", function(e){
    if(e.target.closest(".pin")) return;
    var r = stage.getBoundingClientRect();
    zoomAt(e.clientX - r.left, e.clientY - r.top, 1.8);
  });

  // ---------- selection (crop) ----------
  function finalizeSelection(){
    var el = selRectEl;
    var left = parseFloat(el.style.left)||0, top = parseFloat(el.style.top)||0;
    var w = parseFloat(el.style.width)||0, h = parseFloat(el.style.height)||0;
    state.selStartScreen = null;

    if(w < 12 || h < 12){
      selRectEl.hidden = true;
      selBannerText.textContent = "El área elegida es muy chica. Arrastrá de nuevo sobre el mapa.";
      selConfirm.hidden = true;
      return;
    }

    var nx0 = (left - state.originX) / state.scale;
    var ny0 = (top - state.originY) / state.scale;
    var nx1 = (left + w - state.originX) / state.scale;
    var ny1 = (top + h - state.originY) / state.scale;
    nx0 = Math.max(0, Math.min(NATURAL_W, nx0));
    nx1 = Math.max(0, Math.min(NATURAL_W, nx1));
    ny0 = Math.max(0, Math.min(NATURAL_H, ny0));
    ny1 = Math.max(0, Math.min(NATURAL_H, ny1));

    state.selRectNatural = {x: Math.round(Math.min(nx0,nx1)), y: Math.round(Math.min(ny0,ny1)), w: Math.round(Math.abs(nx1-nx0)), h: Math.round(Math.abs(ny1-ny0))};
    selBannerText.textContent = "Área elegida: " + state.selRectNatural.w + " × " + state.selRectNatural.h + " px";
    selConfirm.hidden = false;
  }

  function enterSelectionMode(){
    state.selecting = true;
    stage.classList.add("selecting");
    selBanner.hidden = false;
    selBannerText.textContent = "Arrastrá sobre el mapa para elegir el área";
    selConfirm.hidden = true;
    selRectEl.hidden = true;
    closeDlMenu();
  }
  function exitSelectionMode(){
    state.selecting = false;
    stage.classList.remove("selecting");
    selBanner.hidden = true;
    selRectEl.hidden = true;
    state.selRectNatural = null;
  }

  $("selCancel").addEventListener("click", exitSelectionMode);
  $("selConfirm").addEventListener("click", function(){
    if(!state.selRectNatural) return;
    downloadCrop(state.selRectNatural);
    exitSelectionMode();
  });

  // ---------- canvas rendering / download ----------
  function drawPinsOnCanvas(ctx, naturalW, naturalH){
    var r = Math.max(naturalW, naturalH) * 0.0115;
    var dr = Math.max(naturalW, naturalH) * 0.006;
    Object.keys(EXTRA_LAYERS).forEach(function(key){
      if(!state.extraVisible[key]) return;
      var color = EXTRA_LAYER_COLOR[key];
      EXTRA_LAYERS[key].forEach(function(m){
        var x = m.pos[0]/100 * naturalW, y = m.pos[1]/100 * naturalH;
        ctx.beginPath();
        ctx.arc(x, y, dr, 0, Math.PI*2);
        ctx.fillStyle = color;
        ctx.fill();
        ctx.lineWidth = dr * 0.22;
        ctx.strokeStyle = "#ffffff";
        ctx.stroke();
      });
    });
    MARKERS.forEach(function(m){
      if(!state.visible.has(m.num)) return;
      var pos = m.pos;
      var x = pos[0]/100 * naturalW, y = pos[1]/100 * naturalH;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI*2);
      ctx.fillStyle = ACCENT_HEX;
      ctx.fill();
      ctx.lineWidth = r * 0.16;
      ctx.strokeStyle = "#ffffff";
      ctx.stroke();
      ctx.fillStyle = "#ffffff";
      ctx.font = "700 " + Math.round(r*0.95) + "px 'IBM Plex Mono', monospace";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(String(m.num), x, y + r*0.04);
    });
  }

  function buildFullCanvas(cb){
    var img = new Image();
    img.onload = function(){
      var canvas = document.createElement("canvas");
      canvas.width = NATURAL_W; canvas.height = NATURAL_H;
      var ctx = canvas.getContext("2d");
      ctx.fillStyle = "#EDF0E6";
      ctx.fillRect(0, 0, NATURAL_W, NATURAL_H);
      if(state.layer === "aerial"){
        ctx.drawImage(img, 0, 0, NATURAL_W, NATURAL_H);
      } else {
        // draw the plan through the same similarity transform used on screen,
        // so the exported image matches the aligned view pixel-for-pixel
        ctx.save();
        ctx.translate(PLAN_TRANSFORM.tx, PLAN_TRANSFORM.ty);
        ctx.rotate(PLAN_TRANSFORM.rotationDeg * Math.PI / 180);
        ctx.scale(PLAN_TRANSFORM.scale, PLAN_TRANSFORM.scale);
        ctx.drawImage(img, 0, 0, PLAN_W, PLAN_H);
        ctx.restore();
      }
      drawPinsOnCanvas(ctx, NATURAL_W, NATURAL_H);
      cb(canvas);
    };
    img.src = (state.layer === "aerial" ? aerialImg.src : planImg.src);
  }

  function layerFileTag(){ return state.layer === "aerial" ? "foto-aerea" : "plano-cotas"; }

  async function saveBlob(blob, filename){
    try{
      var a = document.createElement("a");
      var url = URL.createObjectURL(blob);
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
      toast("Descarga lista.");
    }catch(err){
      toast("No se pudo generar la descarga.");
    }
  }

  function downloadFull(){
    closeDlMenu();
    toast("Generando imagen…");
    buildFullCanvas(function(canvas){
      canvas.toBlob(function(blob){
        if(!blob){ toast("No se pudo generar la imagen."); return; }
        saveBlob(blob, "mapa-estudios-" + layerFileTag() + ".png");
      }, "image/png");
    });
  }

  function downloadCrop(rect){
    toast("Generando recorte…");
    buildFullCanvas(function(canvas){
      var c2 = document.createElement("canvas");
      c2.width = Math.max(1, rect.w);
      c2.height = Math.max(1, rect.h);
      var ctx2 = c2.getContext("2d");
      ctx2.drawImage(canvas, rect.x, rect.y, rect.w, rect.h, 0, 0, rect.w, rect.h);
      c2.toBlob(function(blob){
        if(!blob){ toast("No se pudo generar el recorte."); return; }
        saveBlob(blob, "mapa-estudios-" + layerFileTag() + "-recorte.png");
      }, "image/png");
    });
  }

  // ---------- download menu ----------
  var dlMenu = $("dlMenu"), dlToggle = $("dlToggle");
  function openDlMenu(){ dlMenu.hidden = false; dlToggle.setAttribute("aria-expanded","true"); }
  function closeDlMenu(){ dlMenu.hidden = true; dlToggle.setAttribute("aria-expanded","false"); }
  dlToggle.addEventListener("click", function(e){
    e.stopPropagation();
    if(dlMenu.hidden) openDlMenu(); else closeDlMenu();
  });
  document.addEventListener("click", function(e){
    if(!dlMenu.hidden && !e.target.closest(".dlmenu-wrap")) closeDlMenu();
  });
  $("dlFull").addEventListener("click", downloadFull);
  $("dlCrop").addEventListener("click", enterSelectionMode);

  // ---------- wire up controls ----------
  $("tabAerial").addEventListener("click", function(){ setLayer("aerial"); });
  $("tabPlan").addEventListener("click", function(){ setLayer("plan"); });

  $("zoomIn").addEventListener("click", function(){
    var r = stage.getBoundingClientRect();
    zoomAt(r.width/2, r.height/2, 1.35);
  });
  $("zoomOut").addEventListener("click", function(){
    var r = stage.getBoundingClientRect();
    zoomAt(r.width/2, r.height/2, 1/1.35);
  });
  $("zoomReset").addEventListener("click", function(){ resetView(true); });

  $("search").addEventListener("input", function(e){
    state.search = e.target.value;
    renderRail();
  });
  $("showAll").addEventListener("click", function(){
    MARKERS.forEach(function(m){ state.visible.add(m.num); });
    savePrefs(); updateDlSub(); renderPins(); renderRail();
  });
  $("hideAll").addEventListener("click", function(){
    state.visible.clear();
    savePrefs(); updateDlSub(); renderPins(); renderRail();
    closeDetail();
  });

  Object.keys(EXTRA_LAYER_TOGGLE_ID).forEach(function(key){
    $(EXTRA_LAYER_TOGGLE_ID[key]).addEventListener("change", function(e){
      state.extraVisible[key] = e.target.checked;
      savePrefs();
      renderPins();
    });
  });

  $("railToggle").addEventListener("click", openRailMobile);
  scrim.addEventListener("click", closeRailMobile);

  $("detailClose").addEventListener("click", closeDetail);
  $("detailCenter").addEventListener("click", function(){
    if(state.activeNum != null) centerOn(state.activeNum);
  });

  window.addEventListener("resize", function(){
    if(!state.userMoved) resetView(false);
  });

  // ---------- init ----------
  planLayer.style.transform = PLAN_CSS_TRANSFORM;
  loadPrefs();
  Object.keys(EXTRA_LAYER_TOGGLE_ID).forEach(function(key){
    $(EXTRA_LAYER_TOGGLE_ID[key]).checked = state.extraVisible[key];
  });
  updateExtraLayerCounts();
  setLayer(state.layer);
  renderRail();

  var imagesToLoad = 2, loaded = 0;
  function onImgReady(){
    loaded++;
    if(loaded >= imagesToLoad){
      resetView(false);
      renderPins();
    }
  }
  if(aerialImg.complete) onImgReady(); else aerialImg.addEventListener("load", onImgReady);
  if(planImg.complete) onImgReady(); else planImg.addEventListener("load", onImgReady);

})();
</script>
</body></html>
